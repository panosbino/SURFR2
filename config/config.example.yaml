# =============================================================================
# SURFR2 configuration - example: 3 treated vs 3 untreated samples
#
# Relative paths are resolved against the directory containing THIS file.
# Validate without running anything:
#   bash run_SURFR2.sh -c config/config.example.yaml --dry-run
# Everything below 'comparison' is optional; the values shown are the defaults
# unless marked otherwise.
# =============================================================================

project: my_experiment
samplesheet: samples.example.tsv   # columns: sample_id, condition, file_type, path [, cohort, block]
outdir: /path/to/SURFR2_results/my_experiment

# Which conditions (values of the samplesheet 'condition' column) are compared
comparison:
  case: treated
  control: untreated
  external_controls: []   # extra conditions in which a k-mer must also be (near-)absent
  replicate_in: all       # with a 'cohort' column: require the result in every cohort

kmer:
  k: 17
  canonical: false        # small-RNA libraries are stranded: keep false
  kmc_memory_gb: 8

qc:
  mirtrace_species: hsa   # miRBase code; for non-miRBase species use the closest relative
  adapter: null           # 3' adapter if reads are NOT trimmed, e.g. TGGAATTCTCGGGTGCCAAGG
  phred_offset: null      # 33 or 64 if miRTrace cannot auto-detect it
  mirtrace_memory_gb: 6   # miRTrace Java heap; slurm.sample.mem must exceed it by ~1G

# Condition-blind pre-filter: a k-mer is analysed if it has >= min_count reads in
# >= min_samples case/control samples. 'auto' = the loosest value that cannot drop
# a k-mer the final filters would keep.
candidates:
  min_count: 3
  min_samples: auto

normalization:
  method: cpm             # cpm | median_ratio (use median_ratio if a few very abundant
                          # small RNAs differ between conditions)
  max_reference_kmers: 100000

# Sample-count thresholds accept "all", an integer, or a fraction in (0, 1).
filters:
  min_samples_per_group: 1          # 1 allows single-sample groups (descriptive mode)
  min_case_samples_detected: all    # detected = CPM >= min_cpm_case
  max_control_samples_detected: 0   # detected = CPM >= max_cpm_control
  max_external_samples_detected: 0
  min_cpm_case: 1.0
  max_cpm_control: 0.5
  min_mean_cpm_case: 2.0
  min_log2fc: 2.0                   # log2((mean_case + pc) / (mean_control + pc))
  pseudocount_cpm: 0.1

# auto: edgeR quasi-likelihood test when every group has >= 2 samples, otherwise
#       descriptive mode (filters only, results flagged exploratory)
statistics:
  test: auto              # auto | edger | none
  fdr: 0.05

mergetags:
  enabled: true
  min_overlap: 8

execution:
  executor: slurm         # slurm | local

  # --- where the tools come from -------------------------------------------
  # container: everything runs inside the SURFR2 image (container/Dockerfile).
  #            Reproducible; adding a tool or R package means rebuilding the image.
  # modules:   tools from environment modules, execution.path_prepend and tools.*;
  #            R packages from execution.r_libs. For development: no rebuilds.
  # Changing SURFR2's own code never needs a rebuild in either environment.
  environment: container
  container: /path/to/surfr2.sif     # container environment only
  bind: []                           # e.g. [/cfs/klemming] on Dardel
  modules: []                        # loaded before every step, e.g. [PDC, singularity]

  # A development setup on Dardel instead (versions from 'module spider <name>'):
  # environment: modules
  # modules: [PDC/<ver>, samtools/<ver>, R/<ver>, java/<ver>]
  # path_prepend: [/path/to/surfr2-tools/bin]   # from container/install_tools.sh
  # r_libs: /path/to/R-library-4.4              # from container/install_r_packages.R

  keep_intermediates: false
  slurm:
    account: my-allocation
    # mem: request memory explicitly. The sample step needs max(mirtrace_memory_gb,
    # kmc_memory_gb) + 1G; check what a job got with: sacct -j <id> -o ReqMem,MaxRSS
    sample: {partition: shared, cpus: 8, mem: 16G, time: "04:00:00", array_throttle: 50}
    matrix: {partition: shared, cpus: 8, time: "04:00:00"}
    filter: {partition: shared, cpus: 4, time: "04:00:00"}

# Tool commands: plain names are found on PATH (inside the image, or after module
# loads and path_prepend). Use an absolute path to pin one specific binary.
# tools: {samtools: samtools, pigz: pigz, mirtrace: mirtrace, kmc: kmc,
#         kmc_tools: kmc_tools, mergetags: mergeTags, rscript: Rscript}

# Regression-test config. Expected result: exactly S1_true and S5_one_control recovered.
project: SYNTH
samplesheet: samples.tsv
outdir: out
comparison: {case: cancer, control: adjacent_normal, external_controls: [noncancer_sra], replicate_in: all}
qc: {phred_offset: 33}          # synthetic qualities are constant; auto-detection cannot work
kmer: {k: 17, canonical: false, kmc_memory_gb: 2}
candidates: {min_count: 2, min_case_samples: 5}
normalization: {method: median_ratio}
filters:
  min_samples_per_group: 5
  min_cpm_case: 20
  min_prevalence_case: 0.5
  min_mean_cpm_case: 20
  max_cpm_control: 5
  max_prevalence_control: 0.2
  min_log2fc: 3
  max_prevalence_external: 0.0
execution: {executor: local, container: null}
